<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Openings</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 70em;
    margin: 2em auto;
    padding: 0 1em;
  }
  #controls label {
    margin-right: 1em;
  }
  #boards {
    display: flex;
    flex-wrap: wrap;
    gap: 1em;
    margin: 1em 0;
  }
  .game {
    width: 192px;
  }
  .board {
    display: grid;
    grid-template-columns: repeat(8, 24px);
    grid-template-rows: repeat(8, 24px);
    border: 1px solid #444;
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }
  .light { background: #eed; }
  .dark { background: #997; }
  .caption {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
    margin: 0.3em 0;
    white-space: pre;
  }
  #summary {
    font-weight: bold;
  }
  pre {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 14px;
  }
</style>
</head>
<body>

<h1>Openings</h1>

<p>Twenty workers, one for each legal first move. Each searches the position after its move and the boards are sorted
by the score, so the top left is the first move Naddu likes best. Then each board plays through the line the search found.</p>

<div id="controls">
  <label>Nodes <select id="nodes">
    <option>2000</option>
    <option selected>10000</option>
    <option>50000</option>
    <option>100000</option>
    <option>250000</option>
    <option>500000</option>
  </select></label>
  <button id="start">Start</button>
</div>

<div id="boards"></div>

<p id="summary"></p>

<pre id="results"></pre>

<script>
const PIECES = {
  K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙',
  k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟',
  '.': ''
};

const FIRST_MOVES = [
  'a2a3', 'a2a4', 'b2b3', 'b2b4', 'c2c3', 'c2c4', 'd2d3', 'd2d4', 'e2e3', 'e2e4',
  'f2f3', 'f2f4', 'g2g3', 'g2g4', 'h2h3', 'h2h4', 'b1a3', 'b1c3', 'g1f3', 'g1h3'
];

const STEP_MS = 600; // pause between pv moves when playing through

const boardsEl = document.getElementById('boards');
const summaryEl = document.getElementById('summary');
const resultsEl = document.getElementById('results');

let games = [];
let scored = 0;

function makeGame(first) {
  const el = document.createElement('div');
  el.className = 'game';
  const board = document.createElement('div');
  board.className = 'board';
  for (let rank = 8; rank >= 1; rank--) {
    for (let file = 0; file < 8; file++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + ((rank + file) % 2 ? 'dark' : 'light');
      board.appendChild(sq);
    }
  }
  const caption = document.createElement('div');
  caption.className = 'caption';
  caption.textContent = first;
  el.appendChild(caption);
  el.appendChild(board);
  boardsEl.appendChild(el);
  return {first: first, el: el, board: board, caption: caption, score: 0, pv: [], shown: 0, rows: [], worker: null};
}

function show(game) {
  const squares = game.board.children;
  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++)
      squares[r * 8 + f].textContent = PIECES[game.rows[r][f]];
  }
}

// ask the worker to draw the position after the first n moves of first + pv
function draw(game, n) {
  game.worker.postMessage('position startpos moves ' + game.first + ' ' + game.pv.slice(0, n).join(' '));
  game.worker.postMessage('board');
}

// play through the pv one move at a time
function animate(game) {
  if (game.shown > game.pv.length) {
    game.worker.terminate();
    game.worker = null;
    return;
  }
  draw(game, game.shown);
  game.shown++;
  setTimeout(function() { animate(game); }, STEP_MS);
}

function rank() {
  games.sort(function(a, b) { return b.score - a.score; });
  let text = '';
  for (let i = 0; i < games.length; i++) {
    const g = games[i];
    g.caption.textContent = (i + 1) + '. ' + g.first + '  ' + (g.score > 0 ? '+' : '') + g.score;
    boardsEl.appendChild(g.el); // re-append in ranked order
    text += g.caption.textContent + '  ' + g.pv.join(' ') + '\n';
    animate(g);
  }
  resultsEl.textContent = text;
  summaryEl.textContent = 'Naddu likes ' + games[0].first + ' best and ' + games[games.length - 1].first + ' least';
}

function onMessage(game, line) {
  const row = line.match(/^([1-8])  ((?:[rnbqkpRNBQKP.] ){8})$/);
  if (row) {
    game.rows[8 - parseInt(row[1])] = row[2].trim().split(' ');
    if (row[1] === '1')
      show(game);
  }
  else if (line.startsWith('info ')) {
    const m = line.match(/score (cp|mate) (-?\d+) .* pv (.*)$/);
    if (m) {
      game.score = -(m[1] === 'cp' ? parseInt(m[2]) : (m[2] > 0 ? 10000 : -10000)); // black to move, so negate
      game.pv = m[3].split(' ');
    }
  }
  else if (line.startsWith('bestmove ')) {
    game.caption.textContent = game.first + '  ' + (game.score > 0 ? '+' : '') + game.score;
    scored++;
    if (scored === games.length)
      rank();
  }
}

function start() {
  for (let i = 0; i < games.length; i++)
    if (games[i].worker)
      games[i].worker.terminate();
  boardsEl.innerHTML = '';
  summaryEl.textContent = '';
  resultsEl.textContent = '';
  games = [];
  scored = 0;
  for (let i = 0; i < FIRST_MOVES.length; i++) {
    const game = makeGame(FIRST_MOVES[i]);
    game.worker = new Worker('../naddu.js');
    game.worker.onmessage = function(e) { onMessage(game, e.data); };
    game.worker.postMessage('ucinewgame');
    game.worker.postMessage('position startpos moves ' + game.first);
    game.worker.postMessage('board');
    game.worker.postMessage('go nodes ' + document.getElementById('nodes').value);
    games.push(game);
  }
}

document.getElementById('start').onclick = start;

start();
</script>

</body>
</html>
